[project]
name = "hi-macp"
version = "0.1.0"
description = "HI-MACP: Human-Inspired Multi-Agent Communication Protocol for DevOps orchestration"
authors = [{ name = "Fabrice", email = "fabrice@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "anthropic>=0.34.2",
  "pyyaml>=6.0",
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
hi = "hi_macp.cli.hi:main"
hi-api = "hi_macp.api.server:run"

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["hi_macp*"]
