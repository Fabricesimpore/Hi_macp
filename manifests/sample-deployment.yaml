apiVersion: apps/v1
kind: Deployment
metadata:
  name: hi-macp-sample
  labels:
    app: hi-macp-sample
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hi-macp-sample
  template:
    metadata:
      labels:
        app: hi-macp-sample
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hi-macp-sample
spec:
  selector:
    app: hi-macp-sample
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
